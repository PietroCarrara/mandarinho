<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}mandarinho.com.br{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <!-- Global Header -->
    <header class="border-bottom mb-4">
      <nav class="container py-3">
        <a class="navbar-brand" href="/">Mandarinho</a>
        <a href="/about/">About</a>
      </nav>
    </header>

    <!-- Unique Page Content Placeholder -->
    <main class="container">
      {% block content %}
      <!-- Dynamic content goes here -->
      {% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="container border-top mt-5 py-3 text-body-secondary">
      {% block footer %}
      <p>&copy; 2026 Mandarinho</p>
      {% endblock %}
    </footer>
  </body>
</html>
